// The ontologic engine's API. Length-prefixed Protobuf messages over TLS (gRPC).
//
// A tenant is an isolated brain: its own entities, sources, mentions and relations.
// Imports and questions stream their stages, so a client can show each step as it happens.
//
// Every call signs in with two metadata entries, `user` and `key`; without them, or with a
// wrong pair, the call fails with UNAUTHENTICATED. Admins use every tenant and manage users
// and tenants; members use the tenants an admin granted, and get PERMISSION_DENIED elsewhere.

syntax = "proto3";

package ontologic.v1;

service Ontologic {
  // The engine is up, and which model it uses.
  rpc Health(Empty) returns (HealthReply);

  rpc ListTenants(Empty) returns (TenantList);
  rpc CreateTenant(TenantName) returns (TenantSummary);
  rpc GetTenant(TenantName) returns (TenantSummary);
  rpc DeleteTenant(TenantName) returns (TenantSummary);
  // The committed tenant counted by kind, its files, when it was written and what it has cost
  // over its life. `Show` counts the staged imports too; here `staged` says what waits.
  rpc TenantMeta(TenantName) returns (Meta);

  // Save a sentence as a source, link its names, find its relations, re-link older sources.
  rpc Import(ImportRequest) returns (stream ImportEvent);
  // The same for a file: an email (.eml) or text, linked part by part.
  rpc ImportBlob(BlobRequest) returns (stream ImportEvent);
  // Answer from what the tenant knows, with options and probabilities. Stores nothing.
  rpc Ask(AskRequest) returns (stream AskEvent);

  // Imports wait in a staged copy of the tenant until they are committed: questions do not see
  // them until then. The reply's `staged` is what was committed, or what was dropped.
  rpc Commit(TenantName) returns (TenantSummary);
  rpc Rollback(TenantName) returns (TenantSummary);

  // An empty id shows the tenant; `e1` an entity; `s1` a source.
  rpc Show(ShowRequest) returns (ShowReply);

  // The whole tenant as Turtle, and back.
  rpc ExportTurtle(TenantName) returns (TurtleFile);
  rpc ImportTurtle(TurtleFile) returns (TurtleImported);

  // The signed-in user.
  rpc Me(Empty) returns (User);
  // Admins: add a member; the reply carries their key, the only time it is shown.
  rpc AddUser(UserName) returns (NewUser);
  // Admins: let a member use a tenant, or stop them.
  rpc Grant(Access) returns (User);
  rpc Revoke(Access) returns (User);
  // Who can use a tenant: every admin, then the members granted to it.
  rpc TenantUsers(TenantName) returns (UserList);

  // Documents out of the tenant's current state and back. A retracted document leaves every
  // answer, count and link, and the engine keeps what it said, so it can be restored. An erased
  // document is destroyed: its text, what was read from it and every trace only it left; what
  // stays is a tombstone with the hash of each version. Erase is for admins.
  rpc Retract(DocumentsRequest) returns (LifecycleReply);
  rpc Restore(DocumentsRequest) returns (LifecycleReply);
  rpc Erase(DocumentsRequest) returns (LifecycleReply);

  // Admins: a migration of the tenant's graph, staged (`commit` false: the diff, nothing
  // written) or committed, and a rollback is another migration. Only `REPROJECTION` (the same
  // readings under other rules, no model call) is implemented; the other kinds are refused.
  rpc Migrate(MigrateRequest) returns (MigrateReply);

  // Admins: who may read a document. A caller who cannot read every document of a tenant is
  // answered from what they can read alone, and counted over it.
  rpc SetAcl(AclRequest) returns (Empty);
  // Admins: the groups a member reads a tenant's documents as.
  rpc SetPrincipals(PrincipalsRequest) returns (User);
  // Admins: a reader reads and asks and changes nothing; `reader` false makes them a member.
  rpc SetReader(ReaderRequest) returns (User);

  // Admins: two entities stated to be one.
  rpc Merge(MergeRequest) returns (MergeReply);
  // Admins: how many documents a connector says an origin holds, before it imports; a count
  // over that origin is exact only when what it counted is all there is.
  rpc DeclareSync(SyncRequest) returns (Empty);
}

message Empty {}

message HealthReply {
  // "gpt-5-nano (reasoning low)", or empty when the LLM is not configured.
  string llm = 1;
  // Why the LLM is not configured; empty when it is.
  string llm_error = 2;
  // The tagger that marks candidates before the LLM: "gliner_large-v2.1", or "none (why)".
  string tagger = 3;
  // The build: "3dc5cda, built 2026-09-14 05:12 UTC" (the commit, "-dirty" for uncommitted
  // changes).
  string version = 4;
  // The embedding model: "bge-small-en-v1.5", or "none (why)".
  string embedder = 5;
}

message TenantName {
  string name = 1;
}

// Tokens, calls and time spent.
message Cost {
  uint64 calls = 1;
  uint64 input_tokens = 2;
  uint64 output_tokens = 3;
  uint64 reasoning_tokens = 4;
  // Calls whose response had no usage block.
  uint64 unreported_calls = 5;
  double seconds = 6;
  // Only when the engine knows the model's prices.
  optional double dollars = 7;
  // Part of input_tokens: read from the provider's prompt cache.
  uint64 cached_tokens = 8;
}

message TenantSummary {
  string name = 1;
  uint32 entities = 2;
  uint32 sources = 3;
  uint32 relations = 4;
  // Sources waiting for a relation pass after re-linking.
  uint32 pending_reask = 5;
  Cost cost = 6;
  // What waits for a commit beyond the counts above; unset when nothing is staged.
  Staged staged = 7;
}

// The staged copy of a tenant beyond the committed one. One import adds one source, so
// `sources` is how many imports wait.
message Staged {
  uint32 sources = 1;
  uint32 entities = 2;
  uint32 relations = 3;
}

message KindCount {
  string kind = 1;
  uint32 count = 2;
}

message Meta {
  string tenant = 1;
  // RFC 3339 in UTC; empty for a tenant not written since meta was kept.
  string created = 2;
  string updated = 3;
  // Bytes of the tenant file, of the staged file (0 when nothing is staged), and of the text of
  // every committed source.
  uint64 file_bytes = 4;
  uint64 staged_bytes = 5;
  uint64 source_bytes = 6;
  // Every kind, in a fixed order, zeros included.
  repeated KindCount entities = 7;
  repeated KindCount sources = 8;
  // `value_facts` of the facts end in a value instead of an entity.
  uint32 facts = 9;
  uint32 value_facts = 10;
  uint32 relation_types = 11;
  uint32 mentions = 12;
  uint32 unplaced = 13;
  uint32 unsettled = 14;
  uint32 pending_reask = 15;
  // Unset when nothing is staged.
  Staged staged = 16;
  // Every import and question the tenant has had, failed ones included, and what their calls
  // cost across restarts, in dollars at the prices of the moment each was charged. Seconds are
  // measured in the engine, from the request to the last call.
  uint64 imports = 17;
  Cost import_cost = 18;
  uint64 questions = 19;
  Cost question_cost = 20;
  // Every call since the engine started.
  Cost run = 21;
  // The build, the model and the tagger that last wrote the tenant.
  string version = 22;
  string llm = 23;
  string tagger = 24;
  string embedder = 25;
  // Where the time of every import and question went, added up over the tenant's life.
  Timing import_timing = 26;
  Timing question_timing = 27;
}

message TenantList {
  repeated TenantSummary tenants = 1;
}

// One entity a name might mean, and how sure the brain is, from 0 to 1.
message Guess {
  string entity_id = 1;
  string entity_name = 2;
  float confidence = 3;
}

message CodeMatch {
  string text = 1;
  repeated Guess guesses = 2;
}

// What the check did with one LLM proposal. `detail` is the note or the reason.
message Decision {
  string subject = 1;
  bool accepted = 2;
  string detail = 3;
}

message Entity {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string aliases = 4;
  // "person", "organization", "place", "thing" or "event".
  string kind = 5;
}

message Alias {
  string entity_id = 1;
  string entity_name = 2;
  string alias = 3;
}

// A fact: one per distinct subject, relation and object, however many sources state it. The
// object is an entity, or a value: then `object_id` is empty, `object_name` is the value as the
// source wrote it, and `object_kind` is "date", "time", "money", "percent", "quantity",
// "contact" or "text".
message Relation {
  string id = 1;
  string subject_id = 2;
  string subject_name = 3;
  string predicate = 4;
  string object_id = 5;
  string object_name = 6;
  // As sure as its strongest evidence.
  float confidence = 7;
  reserved 8;
  // The first relation of this type in the tenant.
  bool new_type = 9;
  repeated Evidence evidence = 10;
  string object_kind = 11;
  // The words of the source the fact holds under ("fully diluted"); empty when it always holds.
  string condition = 12;
  // What the fact may be used for: "proposed", "supported" (cited, routed), "accepted" (typed
  // state), "computable" (counted) or "identity-trusted"; empty from an engine that does not say.
  string rung = 13;
}

// One place a source states a fact: the source, which bytes of it, those words, how sure.
message Evidence {
  string source_id = 1;
  uint32 start = 2;
  uint32 end = 3;
  string text = 4;
  float confidence = 5;
}

// A fact the tenant already had, stated again by a new source.
message MoreEvidence {
  Relation relation = 1;
  Evidence evidence = 2;
}

// A sentence in parts: plain text, or a linked name with its guesses (empty: unplaced).
message Segment {
  string text = 1;
  bool link = 2;
  repeated Guess guesses = 3;
}

message Mention {
  string source_id = 1;
  string text = 2;
  uint32 start = 3;
  uint32 end = 4;
  repeated Guess guesses = 5;
  // "code" or "llm".
  string by = 6;
  string source_text = 7;
}

message ImportRequest {
  string tenant = 1;
  string text = 2;
  // The caller's own name for the document, unique in the tenant. The same key with the same
  // bytes is the document it is (nothing is read again); with other bytes, its next version.
  string key = 3;
}

message BlobRequest {
  string tenant = 1;
  // The file name; `.eml` is read as an email, anything else as UTF-8 text.
  string name = 2;
  bytes content = 3;
  // As `ImportRequest.key`.
  string key = 4;
}

message ImportEvent {
  oneof event {
    SourceSaved source = 1;
    CodePass code = 2;
    Linked linked = 3;
    Relinked relinked = 4;
    Reasked reasked = 5;
    Finished finished = 6;
    People people = 7;
  }
}

// The people in an email thread's headers, linked in code before any model call.
message People {
  repeated Entity new_entities = 1;
  repeated Alias new_aliases = 2;
  // People the tenant already had.
  repeated Entity known = 3;
  uint32 messages = 4;
  // Their addresses, as facts (`hasEmail`).
  repeated Relation new_relations = 5;
  repeated RelationType new_types = 6;
  // Each message of the thread as a thing, when new to the tenant (`wrote`, `sentTo`,
  // `copiedTo`, `sentOn` and `about` facts hang on it).
  repeated Entity new_messages = 7;
}

message SourceSaved {
  string id = 1;
  string text = 2;
  // "fact", "text" or "email".
  string kind = 3;
  // The file name of a blob.
  string name = 4;
  // How many parts it is linked in: 1 for a fact.
  uint32 parts = 5;
}

// Names already known, before the LLM is asked.
message CodePass {
  repeated CodeMatch matches = 1;
  // Which part of a blob, from 1; 0 for a fact.
  uint32 part = 2;
  // A blob part's text.
  string text = 3;
}

message Linked {
  // Empty when the call worked; otherwise the code links were kept.
  string llm_error = 1;
  repeated Decision mentions = 2;
  repeated Decision relations = 3;
  repeated Entity new_entities = 4;
  repeated Alias new_aliases = 5;
  repeated Relation new_relations = 6;
  repeated Segment segments = 7;
  Checklist checklist = 8;
  repeated MoreEvidence more_evidence = 9;
  // Which part of a blob, from 1; 0 for a fact.
  uint32 part = 10;
  // Relation types this part is the first to use, with what they mean.
  repeated RelationType new_types = 11;
  // The tagger, the model and the code on this part.
  Timing timing = 12;
}

// Where time went, in milliseconds. A part: tagger, model, code (the checks and applying). An
// import: those added over its parts (which run at the same time, so they can exceed total),
// then relink, reask and save. A question: context and model. Zero is left out when shown.
message Timing {
  uint64 tagger_ms = 1;
  uint64 model_ms = 2;
  uint64 code_ms = 3;
  uint64 relink_ms = 4;
  uint64 reask_ms = 5;
  uint64 save_ms = 6;
  uint64 context_ms = 7;
  uint64 total_ms = 8;
}

// The checklist of one pass: the candidates the tagger found in the text, the ones the LLM's
// first answer left out and was asked about again, and the ones still left out after that.
message Checklist {
  repeated Candidate found = 1;
  repeated string follow_up = 2;
  repeated string undecided = 3;
  // Why the tagger found nothing, when it failed.
  string error = 4;
}

// Words the tagger marked as a thing or a value, with the kind it guessed and how sure it is.
message Candidate {
  string text = 1;
  string kind = 2;
  float probability = 3;
}

message Relinked {
  repeated Mention mentions = 1;
}

// One earlier source asked for relations again.
message Reasked {
  string source_id = 1;
  string llm_error = 2;
  repeated Decision relations = 3;
  repeated Relation new_relations = 4;
  repeated MoreEvidence more_evidence = 5;
  repeated RelationType new_types = 6;
}

message Finished {
  Cost cost = 1;
  // Sources still waiting for a relation pass.
  uint32 waiting = 2;
  Timing timing = 3;
}

message AskRequest {
  string tenant = 1;
  string question = 2;
  // Leave the source text out and answer from facts alone: measures what the graph holds.
  bool graph_only = 3;
  // Answer from the staged copy, imports not committed yet included.
  bool staged = 4;
}

message AskEvent {
  oneof event {
    AskIndex index = 1;
    AskAnswer answer = 2;
    Finished finished = 3;
  }
}

// What the question names, and how much evidence was gathered, before the LLM is asked.
message AskIndex {
  repeated CodeMatch matches = 1;
  uint32 entities = 2;
  uint32 relations = 3;
  uint32 sources = 4;
}

// An id an answer rests on: a relation, a source or an entity.
message Citation {
  string id = 1;
  // "Maya livesIn Toronto" for a relation, the text for a source.
  string label = 2;
  // A relation's stored confidence.
  optional float stored = 3;
}

message AnswerOption {
  string answer = 1;
  string entity_id = 2;
  string entity_name = 3;
  float probability = 4;
  repeated Citation based_on = 5;
}

message AskAnswer {
  string error = 1;
  repeated AnswerOption options = 2;
  float something_else = 3;
  // What the check dropped or flagged.
  repeated string notes = 4;
  // True when the question has one answer and the options exclude each other; false for a set
  // whose answers can all be right, each with its own probability.
  bool exclusive = 5;
  // Set when the answer is a number the engine computed: its floor and ceiling.
  CountRange count = 6;
}

// A computed number: what it counts ("count", "distinct <field>", "top <field>"), its floor,
// its ceiling (unset when nothing bounds it), and how far it can be claimed: "exact", "over the
// records held", "judged" or "bounded".
message CountRange {
  string operation = 1;
  uint64 lower = 2;
  optional uint64 upper = 3;
  string status = 4;
}

message ShowRequest {
  string tenant = 1;
  string id = 2;
}

message ShowReply {
  oneof view {
    Overview overview = 1;
    EntityView entity = 2;
    SourceView source = 3;
  }
}

message EntityLine {
  string id = 1;
  string name = 2;
  repeated string other_names = 3;
  uint32 mentions = 4;
  uint32 relations = 5;
}

message CallLine {
  string what = 1;
  double seconds = 2;
  uint64 input_tokens = 3;
  uint64 output_tokens = 4;
}

message Overview {
  TenantSummary summary = 1;
  uint32 unplaced = 2;
  uint32 unsettled = 3;
  repeated EntityLine entities = 4;
  // Was a list of type names; relation_types carries their meaning.
  reserved 5;
  repeated CallLine recent_calls = 6;
  repeated string source_ids = 7;
  repeated RelationType relation_types = 8;
}

// A relation type and what it means, as the fact that first used it said. A type from before
// meanings were stored has only its name.
message RelationType {
  string name = 1;
  // Read from subject to object: "the subject works for the object".
  string definition = 2;
  string subject_role = 3;
  string object_role = 4;
  // The same fact read from object to subject; empty when not known.
  string inverse = 5;
  // A subject has one object of this type at a time.
  bool single_valued = 6;
}

message EntityView {
  Entity entity = 1;
  repeated Relation relations = 2;
  repeated Mention mentions = 3;
}

message SourceView {
  string id = 1;
  string text = 2;
  repeated Mention mentions = 3;
  repeated Relation relations = 4;
  repeated Segment segments = 5;
}

message TurtleFile {
  string tenant = 1;
  string content = 2;
  // Set on export.
  TenantSummary summary = 3;
}

message TurtleImported {
  TenantSummary summary = 1;
  // Set when the file came from another tenant.
  string warning = 2;
}

message UserName {
  string name = 1;
}

message User {
  string name = 1;
  // "admin", "member" or "reader".
  string role = 2;
  // The tenants a member was granted; empty for admins, who use every tenant.
  repeated string tenants = 3;
  // The groups a member reads each tenant's documents as.
  repeated TenantGroups principals = 4;
}

message TenantGroups {
  string tenant = 1;
  repeated string groups = 2;
}

message DocumentsRequest {
  string tenant = 1;
  // Document ids (`d3`).
  repeated string documents = 2;
  string reason = 3;
}

message Counts {
  uint32 entities = 1;
  uint32 relations = 2;
  uint32 sources = 3;
}

message LifecycleReply {
  repeated string documents = 1;
  Counts before = 2;
  Counts after = 3;
}

enum MigrationKind {
  // The same readings under other rules; no model call.
  REPROJECTION = 0;
  // Identity decided again from the same candidates. Not implemented yet.
  RE_RESOLUTION = 1;
  // The documents read again under another schema or prompt; model calls. Not implemented yet.
  RE_EXTRACTION = 2;
}

message SchemaPin {
  string kind = 1;
  uint32 version = 2;
}

message MigrateRequest {
  string tenant = 1;
  MigrationKind kind = 2;
  repeated SchemaPin pins = 3;
  string reason = 4;
  bool commit = 5;
}

message TypeChange {
  string relation_type = 1;
  uint32 added = 2;
  uint32 removed = 3;
  uint32 promoted = 4;
  uint32 demoted = 5;
}

// What a migration changes, facts matched by what makes them that fact.
message MigrationDiff {
  uint32 facts_added = 1;
  uint32 facts_removed = 2;
  uint32 promoted = 3;
  uint32 demoted = 4;
  uint32 support_changed = 5;
  uint32 facts_unchanged = 6;
  uint32 entities_added = 7;
  uint32 entities_removed = 8;
  uint32 entities_renamed = 9;
  uint32 identity_changed = 10;
  uint32 model_calls = 11;
  repeated TypeChange by_type = 12;
}

message MigrateReply {
  bool committed = 1;
  MigrationDiff diff = 2;
}

message AclRequest {
  string tenant = 1;
  string document = 2;
  // `user:<name>` or a group; any one of them reads the document.
  repeated string principals = 3;
}

message PrincipalsRequest {
  string user = 1;
  string tenant = 2;
  repeated string groups = 3;
}

message ReaderRequest {
  string user = 1;
  bool reader = 2;
}

message MergeRequest {
  string tenant = 1;
  string from = 2;
  string into = 3;
  string why = 4;
}

message MergeReply {
  string into = 1;
  string from = 2;
  // The names the survivor gained.
  repeated string aliases = 3;
}

message SyncRequest {
  string tenant = 1;
  string origin = 2;
  optional uint64 expected = 3;
}

message NewUser {
  User user = 1;
  string key = 2;
}

message Access {
  string user = 1;
  string tenant = 2;
}

message UserList {
  repeated User users = 1;
}
